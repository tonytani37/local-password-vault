<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Password Vault</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 960px; margin: 32px auto; padding: 0 20px; color: #333; }
    .hidden { display: none !important; }
    .card { border: 1px solid #ddd; padding: 24px; border-radius: 8px; margin-bottom: 24px; background-color: #fafafa; }
    input[type="password"], input[type="text"], input[type="url"], input[type="file"] {
      width: 100%; padding: 10px; margin: 6px 0 16px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;
    }
    button { padding: 10px 20px; background-color: #0066cc; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #0052a3; }
    button.secondary { background-color: #666; }
    button.secondary:hover { background-color: #444; }
    button.small { padding: 3px 9px; font-size: 12px; }
    button.danger { background-color: #c62828; }
    button.danger:hover { background-color: #8e0000; }
    .form-group { margin-bottom: 12px; }
    code { word-break: break-all; }

    /* タブ */
    .tabs { display: flex; align-items: flex-end; gap: 4px; border-bottom: 2px solid #ddd; margin-bottom: 20px; }
    .tab-btn { background-color: #e8e8e8; color: #333; border-radius: 6px 6px 0 0; }
    .tab-btn:hover { background-color: #d8d8d8; }
    .tab-btn.active, .tab-btn.active:hover { background-color: #0066cc; color: #fff; }
    .tabs .spacer { flex: 1; }
    .tabs .logout { margin-bottom: 4px; }

    /* 一覧（コンパクト表示） */
    table { width: 100%; border-collapse: collapse; margin-top: 8px; background: #fff; table-layout: fixed; }
    th, td { border: 1px solid #eee; padding: 5px 8px; text-align: left; vertical-align: middle; line-height: 1.3; }
    th { background-color: #f0f0f0; }
    td .title { display: block; font-weight: bold; overflow-wrap: anywhere; }
    td .url { display: block; margin-top: 1px; font-size: 12px; color: #666; overflow-wrap: anywhere; }
    td .url a { color: #0066cc; text-decoration: none; }
    td .url a:hover { text-decoration: underline; }
    .user-cell { overflow-wrap: anywhere; }
    .pw-cell { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .pw-cell code { flex: 0 1 auto; margin-right: 4px; }
    td .created-at { display: block; margin-top: 2px; font-size: 11px; color: #888; }
    tr.new-row td { background-color: #fff8d6; }

    /* === モダン通知 UI（トースト通知） === */
    #toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-width: 280px;
      max-width: 400px;
      padding: 13px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.14), 0 4px 10px -2px rgba(15, 23, 42, 0.06);
      border: 1px solid rgba(226, 232, 240, 0.95);
      border-left: 4px solid #0066cc;
      color: #1e293b;
      font-size: 0.9rem;
      line-height: 1.45;
      animation: toastSlideIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .toast.hiding { opacity: 0; transform: translateX(24px); }
    .toast-icon { flex-shrink: 0; width: 20px; height: 20px; margin-top: 1px; }
    .toast-body { flex: 1; word-break: break-word; }
    .toast-title { font-weight: 700; font-size: 0.84rem; margin-bottom: 2px; }
    .toast-close {
      background: none !important; border: none; color: #94a3b8; cursor: pointer;
      padding: 0 2px; font-size: 18px; line-height: 1; font-weight: normal;
    }
    .toast-close:hover { color: #475569; }

    .toast--success { border-left-color: #10b981; }
    .toast--success .toast-icon { color: #10b981; }
    .toast--warning { border-left-color: #f59e0b; background: rgba(255, 251, 235, 0.98); }
    .toast--warning .toast-icon { color: #d97706; }
    .toast--error { border-left-color: #ef4444; background: rgba(254, 242, 242, 0.98); }
    .toast--error .toast-icon { color: #dc2626; }
    .toast--info { border-left-color: #0066cc; }
    .toast--info .toast-icon { color: #0066cc; }

    @keyframes toastSlideIn {
      from { opacity: 0; transform: translateX(32px) scale(0.96); }
      to   { opacity: 1; transform: translateX(0) scale(1); }
    }

    /* === フォーム内インラインアラート === */
    .inline-alert {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 14px;
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.45;
      border: 1px solid transparent;
      border-left-width: 4px;
      animation: alertFadeIn 0.2s ease-out;
    }
    .inline-alert-icon { flex-shrink: 0; width: 18px; height: 18px; margin-top: 2px; }
    .inline-alert-text { flex: 1; word-break: break-word; }

    .inline-alert--success { background: #ecfdf5; border-color: #a7f3d0; border-left-color: #10b981; color: #065f46; }
    .inline-alert--success .inline-alert-icon { color: #10b981; }
    .inline-alert--error { background: #fef2f2; border-color: #fecaca; border-left-color: #ef4444; color: #991b1b; }
    .inline-alert--error .inline-alert-icon { color: #dc2626; }
    .inline-alert--warning { background: #fffbeb; border-color: #fde68a; border-left-color: #f59e0b; color: #92400e; }
    .inline-alert--warning .inline-alert-icon { color: #d97706; }

    @keyframes alertFadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* === オフライン閲覧専用モード用バナー === */
    .readonly-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      margin-bottom: 16px;
      border-radius: 10px;
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      border: 1px solid #fcd34d;
      color: #92400e;
      font-size: 0.88rem;
      line-height: 1.4;
      box-shadow: 0 2px 6px rgba(245, 158, 11, 0.08);
    }
    .readonly-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 9999px;
      background: #f59e0b;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    /* === カスタム確認モーダル === */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      animation: backdropFadeIn 0.18s ease-out forwards;
    }

    .modal-dialog {
      width: 100%;
      max-width: 420px;
      padding: 22px 24px 20px;
      border-radius: 14px;
      background: #ffffff;
      border: 1px solid rgba(226, 232, 240, 0.95);
      box-shadow: 0 20px 35px -10px rgba(15, 23, 42, 0.25), 0 8px 16px -6px rgba(15, 23, 42, 0.1);
      animation: modalPopIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .modal-icon-badge {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-icon-badge svg { width: 22px; height: 22px; }
    .modal-icon-badge--danger { background: #fef2f2; color: #dc2626; }
    .modal-icon-badge--info   { background: #eff6ff; color: #0066cc; }

    .modal-content { flex: 1; min-width: 0; }
    .modal-title {
      margin: 0 0 6px;
      font-size: 1.02rem;
      font-weight: 700;
      color: #0f172a;
    }
    .modal-message {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.55;
      color: #475569;
      word-break: break-word;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 22px;
    }
    .modal-actions button {
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.88rem;
    }
    .modal-cancel-btn {
      background-color: #f1f5f9 !important;
      color: #334155 !important;
      border: 1px solid #cbd5e1 !important;
    }
    .modal-cancel-btn:hover { background-color: #e2e8f0 !important; }

    @keyframes backdropFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes modalPopIn {
      from { opacity: 0; transform: scale(0.94) translateY(8px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
  </style>
</head>
<body>

  <h2>パスワードマネージャー</h2>

  <!-- 初期設定 -->
  <div id="setupSection" class="card hidden">
    <h3>マスターパスワードの初期設定</h3>
    <p>このアプリケーションを保護するマスターパスワードを設定してください。忘れると保存データは復元できません。</p>
    <form id="setupForm">
      <label for="setupPassword">マスターパスワード (12文字以上):</label>
      <input type="password" id="setupPassword" required minlength="12" autocomplete="new-password" placeholder="マスターパスワードを入力">
      <button type="submit">初期設定を実行</button>
    </form>
    <div id="setupError" class="hidden"></div>
  </div>

  <!-- ログイン -->
  <div id="loginSection" class="card hidden">
    <h3>ロック解除</h3>
    <form id="loginForm">
      <input type="text" name="username" value="vault-master-user" autocomplete="username" style="display:none;" />
      <label for="masterPassword">マスターパスワード:</label>
      <input type="password" id="masterPassword" name="password" autocomplete="current-password" required placeholder="マスターパスワードを入力">
      <button type="submit">ロック解除</button>
    </form>
    <div id="loginError" class="hidden"></div>
  </div>

  <!-- メイン（タブ） -->
  <div id="vaultSection" class="card hidden">
    <div class="tabs">
      <button type="button" class="tab-btn active" id="tabListBtn" data-tab="list">登録済み一覧</button>
      <button type="button" class="tab-btn" id="tabAddBtn" data-tab="add">新規登録</button>
      <span class="spacer"></span>
      <button type="button" id="logoutBtn" class="secondary small logout">再ロック（ログアウト）</button>
    </div>

    <!-- オフライン閲覧専用モード警告バナー -->
    <div id="readonlyBanner" class="readonly-banner hidden">
      <span class="readonly-badge">閲覧専用モード</span>
      <span>クラウドと同期できないため、ローカルキャッシュで閲覧専用起動しています（追加・削除はロック中です）。</span>
    </div>

    <!-- タブ1: 登録済み一覧・検索 -->
    <div id="tabList">
      <input type="text" id="searchBox" autocomplete="off" placeholder="タイトル・URL・ユーザー名で検索" style="margin-bottom: 6px;">
      <p id="countLabel" style="margin: 0 0 4px; color: #555;"></p>
      <table id="vaultTable">
        <colgroup>
          <col style="width: 42%;">
          <col style="width: 24%;">
          <col style="width: 34%;">
        </colgroup>
        <thead>
          <tr><th>タイトル / URL</th><th>ユーザー名</th><th>パスワード</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- タブ2: 新規登録・CSVインポート -->
    <div id="tabAdd" class="hidden">
      <h3>新規アカウント追加</h3>
      <form id="addForm">
        <div class="form-group">
          <label for="addTitle">タイトル (必須):</label>
          <input type="text" id="addTitle" required placeholder="例: Google">
        </div>
        <div class="form-group">
          <label for="addUrl">URL:</label>
          <input type="url" id="addUrl" placeholder="例: https://accounts.google.com">
        </div>
        <div class="form-group">
          <label for="addUsername">ユーザー名 / メールアドレス:</label>
          <input type="text" id="addUsername" autocomplete="off" placeholder="例: user@example.com">
        </div>
        <div class="form-group">
          <label for="addPassword">パスワード (必須):</label>
          <input type="password" id="addPassword" required autocomplete="new-password" placeholder="暗号化保存するパスワード">
        </div>
        <button type="submit">暗号化して保存</button>
      </form>
      <div id="addMsg" class="hidden"></div>

      <hr style="margin: 30px 0; border: 0; border-top: 1px solid #ddd;">

      <h3>Chrome CSVパスワードインポート</h3>
      <form id="importForm">
        <input type="file" id="csvFile" accept=".csv" required>
        <button type="submit" class="secondary">CSVインポート実行</button>
      </form>
      <div id="importMsg" class="hidden"></div>
    </div>
  </div>

  <!-- トースト通知領域 -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- カスタム確認モーダル -->
  <div id="confirmModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
    <div class="modal-dialog">
      <div class="modal-header">
        <div id="confirmModalIcon" class="modal-icon-badge modal-icon-badge--danger"></div>
        <div class="modal-content">
          <h4 id="confirmModalTitle" class="modal-title"></h4>
          <p id="confirmModalMessage" class="modal-message"></p>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" id="confirmCancelBtn" class="modal-cancel-btn">キャンセル</button>
        <button type="button" id="confirmOkBtn" class="danger">削除する</button>
      </div>
    </div>
  </div>

  <script>
    // セッショントークンはメモリ上のみ（localStorage等には保存しない）
    let token = null;
    let allItems = [];
    let highlightAfterId = null; // このIDより大きい行を「今回の取り込み分」として強調
    let isReadOnlyMode = false;

    const $ = (id) => document.getElementById(id);
    const sections = { setup: $('setupSection'), login: $('loginSection'), vault: $('vaultSection') };

    // === 通知 UI ヘルパー ===
    const UI_ICONS = {
      success: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
      warning: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
      error:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`,
      info:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`,
      trash:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>`
    };

    const TOAST_TITLES = {
      success: '完了',
      warning: '注意',
      error:   'エラー',
      info:    'お知らせ'
    };

    function showToast(message, type = 'info', title = '', duration = 3800) {
      const container = $('toast-container');
      if (!container) return;

      const toast = document.createElement('div');
      toast.className = `toast toast--${type}`;

      const iconWrap = document.createElement('div');
      iconWrap.className = 'toast-icon';
      iconWrap.innerHTML = UI_ICONS[type] || UI_ICONS.info;

      const body = document.createElement('div');
      body.className = 'toast-body';

      const titleEl = document.createElement('div');
      titleEl.className = 'toast-title';
      titleEl.textContent = title || TOAST_TITLES[type] || '';

      const msgEl = document.createElement('div');
      msgEl.textContent = message;

      body.append(titleEl, msgEl);

      const closeBtn = document.createElement('button');
      closeBtn.className = 'toast-close';
      closeBtn.type = 'button';
      closeBtn.setAttribute('aria-label', '閉じる');
      closeBtn.textContent = '×';

      const removeToast = () => {
        if (toast.classList.contains('hiding')) return;
        toast.classList.add('hiding');
        setTimeout(() => toast.remove(), 220);
      };

      closeBtn.addEventListener('click', removeToast);
      toast.append(iconWrap, body, closeBtn);
      container.appendChild(toast);

      if (duration > 0) setTimeout(removeToast, duration);
    }

    function setInlineAlert(el, message, type = 'error') {
      if (!el) return;
      if (!message) {
        el.className = 'hidden';
        el.replaceChildren();
        return;
      }
      el.className = `inline-alert inline-alert--${type}`;
      const iconWrap = document.createElement('div');
      iconWrap.className = 'inline-alert-icon';
      iconWrap.innerHTML = UI_ICONS[type] || UI_ICONS.error;

      const textWrap = document.createElement('div');
      textWrap.className = 'inline-alert-text';
      textWrap.textContent = message;

      el.replaceChildren(iconWrap, textWrap);
    }

    // === カスタム確認モーダル ===
    function showConfirm({
      title = '確認',
      message = '',
      confirmText = '実行する',
      cancelText = 'キャンセル',
      danger = true
    } = {}) {
      return new Promise((resolve) => {
        const modal = $('confirmModal');
        const iconEl = $('confirmModalIcon');
        const titleEl = $('confirmModalTitle');
        const msgEl = $('confirmModalMessage');
        const okBtn = $('confirmOkBtn');
        const cancelBtn = $('confirmCancelBtn');

        titleEl.textContent = title;
        msgEl.textContent = message;
        okBtn.textContent = confirmText;
        cancelBtn.textContent = cancelText;

        iconEl.className = `modal-icon-badge ${danger ? 'modal-icon-badge--danger' : 'modal-icon-badge--info'}`;
        iconEl.innerHTML = danger ? UI_ICONS.trash : UI_ICONS.info;
        okBtn.className = danger ? 'danger' : '';

        modal.classList.remove('hidden');
        cancelBtn.focus();

        const cleanup = (result) => {
          modal.classList.add('hidden');
          okBtn.removeEventListener('click', onOk);
          cancelBtn.removeEventListener('click', onCancel);
          modal.removeEventListener('click', onBackdrop);
          document.removeEventListener('keydown', onKeyDown);
          resolve(result);
        };

        const onOk = () => cleanup(true);
        const onCancel = () => cleanup(false);
        const onBackdrop = (e) => { if (e.target === modal) cleanup(false); };
        const onKeyDown = (e) => { if (e.key === 'Escape') cleanup(false); };

        okBtn.addEventListener('click', onOk);
        cancelBtn.addEventListener('click', onCancel);
        modal.addEventListener('click', onBackdrop);
        document.addEventListener('keydown', onKeyDown);
      });
    }

    function applyReadOnlyUI(readOnly) {
      isReadOnlyMode = !!readOnly;
      $('readonlyBanner').classList.toggle('hidden', !isReadOnlyMode);
      $('tabAddBtn').classList.toggle('hidden', isReadOnlyMode);
      if (isReadOnlyMode) showTab('list');
    }

    function show(name) {
      for (const [k, el] of Object.entries(sections)) el.classList.toggle('hidden', k !== name);
    }

    // タブ切り替え
    function showTab(name) {
      $('tabList').classList.toggle('hidden', name !== 'list');
      $('tabAdd').classList.toggle('hidden', name !== 'add');
      $('tabListBtn').classList.toggle('active', name === 'list');
      $('tabAddBtn').classList.toggle('active', name === 'add');
    }
    document.querySelectorAll('.tab-btn').forEach((b) =>
      b.addEventListener('click', () => showTab(b.dataset.tab)));

    async function api(path, { method = 'GET', body, form } = {}) {
      const headers = {};
      if (token) headers['Authorization'] = 'Bearer ' + token;
      let payload;
      if (form) {
        payload = form;
      } else if (body !== undefined) {
        headers['Content-Type'] = 'application/json';
        payload = JSON.stringify(body);
      }
      const res = await fetch(path, { method, headers, body: payload });
      let data = {};
      try { data = await res.json(); } catch {}
      if (res.status === 401 && data.code === 'SESSION_EXPIRED') {
        lock('セッションの有効期限が切れました。再度ログインしてください。', 'warning');
      } else if (res.status === 503) {
        applyReadOnlyUI(true);
        if (allItems.length > 0) applyFilter();
      }
      return { ok: res.ok, status: res.status, data };
    }

    // 画面とメモリ上のデータを破棄してログイン画面へ
    function lock(message = '', alertType = 'warning') {
      token = null;
      allItems = [];
      highlightAfterId = null;
      $('searchBox').value = '';
      $('countLabel').textContent = '';
      setInlineAlert($('addMsg'), '');
      setInlineAlert($('importMsg'), '');
      $('vaultTable').querySelector('tbody').replaceChildren();
      $('masterPassword').value = '';
      setInlineAlert($('loginError'), message, alertType);
      show('login');
    }

    // 起動時の初期化チェック
    async function checkStatus() {
      const { data } = await api('/api/status');
      applyReadOnlyUI(data.readOnly);
      show(data.isInitialized ? 'login' : 'setup');
    }
    checkStatus();

    // 初期設定
    $('setupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      setInlineAlert($('setupError'), '');
      const masterPassword = $('setupPassword').value;
      const { ok, data } = await api('/api/setup', { method: 'POST', body: { masterPassword } });
      if (ok) {
        $('setupPassword').value = '';
        show('login');
        showToast('マスターパスワードを設定しました。ログインしてください。', 'success', '初期設定完了', 4500);
      } else {
        setInlineAlert($('setupError'), data.error || 'エラーが発生しました。', 'error');
      }
    });

    // ログイン
    $('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      setInlineAlert($('loginError'), '');
      const masterPassword = $('masterPassword').value;
      const { ok, data } = await api('/api/login', { method: 'POST', body: { masterPassword } });
      $('masterPassword').value = '';
      if (ok) {
        token = data.token;
        showTab('list');
        show('vault');
        await refreshList();
        if (isReadOnlyMode) {
          showToast('オフラインのため閲覧専用モードでロック解除しました。', 'warning', 'ロック解除（閲覧専用）', 4500);
        } else {
          showToast('ロックを解除しました。', 'success', 'ログイン成功', 2600);
        }
      } else {
        setInlineAlert($('loginError'), data.error || 'エラーが発生しました。', 'error');
      }
    });

    // 新規登録
    $('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        title: $('addTitle').value,
        url: $('addUrl').value,
        username: $('addUsername').value,
        password: $('addPassword').value
      };
      const { ok, data } = await api('/api/credentials', { method: 'POST', body });
      if (ok) {
        setInlineAlert($('addMsg'), '');
        $('addForm').reset();
        showToast(data.message || '新しいアカウント情報を登録しました。', 'success', '登録完了');
        refreshList();
      } else {
        setInlineAlert($('addMsg'), data.error || 'エラーが発生しました。', 'error');
      }
    });

    // CSVインポート
    $('importForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = $('csvFile');
      const prevMaxId = allItems.reduce((m, it) => Math.max(m, it.id), 0);
      const form = new FormData();
      form.append('file', fileInput.files[0]);
      const { ok, data } = await api('/api/import-csv', { method: 'POST', form });
      if (ok) {
        const skipped = data.skipped ? `（パスワード空欄のためスキップ: ${data.skipped} 件）` : '';
        const msg = `${data.count} 件をインポートしました${skipped}。「登録済み一覧」タブの黄色い行が今回の取り込み分です。`;
        setInlineAlert($('importMsg'), msg, 'success');
        showToast(`${data.count} 件のアカウントを取り込みました。`, 'success', 'CSVインポート完了');
        fileInput.value = '';
        highlightAfterId = prevMaxId;
        $('searchBox').value = '';
        refreshList();
      } else {
        setInlineAlert($('importMsg'), data.error || 'エラーが発生しました。', 'error');
      }
    });

    async function refreshList() {
      const { ok, data } = await api('/api/credentials');
      if (ok) {
        allItems = data.data;
        applyFilter();
      }
    }

    function applyFilter() {
      const q = $('searchBox').value.trim().toLowerCase();
      const items = q
        ? allItems.filter((it) =>
            [it.title, it.url, it.username].some((v) => (v || '').toLowerCase().includes(q)))
        : allItems;
      $('countLabel').textContent = q
        ? `全 ${allItems.length} 件中 ${items.length} 件を表示`
        : `全 ${allItems.length} 件`;
      renderVault(items);
    }
    $('searchBox').addEventListener('input', applyFilter);

    // 登録日時を YYYY/MM/DD HH:mm 形式に整形
    function formatCreatedAt(raw) {
      if (!raw) return '';
      // SQLiteの "YYYY-MM-DD HH:MM:SS" (UTC) 形式にも対応
      const normalized = /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}/.test(raw)
        ? raw.replace(' ', 'T') + 'Z'
        : raw;
      const d = new Date(normalized);
      if (Number.isNaN(d.getTime())) return raw;
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    // http/https のURLのみリンク化（javascript: 等を防ぐ）
    function safeHref(u) {
      try {
        const parsed = new URL(u);
        return parsed.protocol === 'http:' || parsed.protocol === 'https:' ? parsed.href : null;
      } catch {
        return null;
      }
    }

    function makeButton(label, onClick, extraClass = '') {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'small ' + extraClass;
      b.textContent = label;
      b.addEventListener('click', onClick);
      return b;
    }

let clipboardTimer = null;

    function renderVault(items) {
      const tbody = $('vaultTable').querySelector('tbody');
      tbody.replaceChildren();
      if (items.length === 0) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 3;
        td.textContent = 'データが存在しません。';
        tr.appendChild(td);
        tbody.appendChild(tr);
        return;
      }

      for (const item of items) {
        const tr = document.createElement('tr');
        if (highlightAfterId !== null && item.id > highlightAfterId) tr.className = 'new-row';

        // タイトル + URL + 登録日時（textContentで挿入するのでHTMLとして解釈されない）
        const tdTitle = document.createElement('td');
        const title = document.createElement('span');
        title.className = 'title';
        title.textContent = item.title;
        tdTitle.appendChild(title);
        if (item.url) {
          const urlLine = document.createElement('span');
          urlLine.className = 'url';
          const href = safeHref(item.url);
          if (href) {
            const a = document.createElement('a');
            a.href = href;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.textContent = item.url;
            urlLine.appendChild(a);
          } else {
            urlLine.textContent = item.url;
          }
          tdTitle.appendChild(urlLine);
        }
        if (item.created_at) {
          const dateLine = document.createElement('span');
          dateLine.className = 'created-at';
          dateLine.textContent = `登録: ${formatCreatedAt(item.created_at)}`;
          tdTitle.appendChild(dateLine);
        }

        const tdUser = document.createElement('td');
        tdUser.className = 'user-cell';
        tdUser.textContent = item.username || '-';

        // パスワード（通常はマスク表示。ボタンは同じ行に並べる）
        const tdPw = document.createElement('td');
        const wrap = document.createElement('div');
        wrap.className = 'pw-cell';
        const code = document.createElement('code');
        const MASK = '••••••••';
        let visible = false;
        code.textContent = MASK;

        const toggleBtn = makeButton('表示', () => {
          visible = !visible;
          code.textContent = visible ? item.password : MASK;
          toggleBtn.textContent = visible ? '隠す' : '表示';
        }, 'secondary');

        const copyBtn = makeButton('コピー', async () => {
          try {
            await navigator.clipboard.writeText(item.password);
            copyBtn.textContent = 'コピー済み';
            showToast('クリップボードにコピーしました（30秒後に自動消去）', 'info', 'コピー完了', 2800);
            clearTimeout(clipboardTimer);
            clipboardTimer = setTimeout(() => navigator.clipboard.writeText('').catch(() => {}), 30000);
            setTimeout(() => (copyBtn.textContent = 'コピー'), 1500);
          } catch {
            showToast('クリップボードへのコピーに失敗しました。', 'error', 'コピー失敗');
          }
        }, 'secondary');

        wrap.append(code, toggleBtn, copyBtn);

        if (!isReadOnlyMode) {
          const delBtn = makeButton('削除', async () => {
            const confirmed = await showConfirm({
              title: 'アカウント情報の削除',
              message: `「${item.title}」を削除しますか？この操作は取り消せません。`,
              confirmText: '削除する',
              cancelText: 'キャンセル',
              danger: true
            });
            if (!confirmed) return;

            const { ok, data } = await api('/api/credentials/' + item.id, { method: 'DELETE' });
            if (ok) {
              showToast(`「${item.title}」を削除しました。`, 'success', '削除完了');
              refreshList();
            } else {
              showToast(data.error || '削除に失敗しました。', 'error', '削除エラー');
            }
          }, 'danger');
          wrap.appendChild(delBtn);
        }

        tdPw.appendChild(wrap);
        tr.append(tdTitle, tdUser, tdPw);
        tbody.appendChild(tr);
      }
    }

    // ログアウト
    $('logoutBtn').addEventListener('click', async () => {
      await api('/api/logout', { method: 'POST' });
      lock('');
      showToast('ログアウトし、メモリ上の暗号鍵を消去しました。', 'info', '再ロック完了', 2800);
    });
  </script>
</body>
</html>
